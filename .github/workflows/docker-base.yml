name: Build base Docker images

# Only build when the dockerfile has changed, otherwise scheduled on the first
# of each month
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'extras/docker/base/Dockerfile'
      - '.github/workflows/docker-base.yml'
  schedule:
    - cron: '0 5 1 * *'

permissions:
  contents: read

jobs:
  path-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      # The base image holds no wger code, only Ubuntu and apt packages, so it
      # is tagged by build date.
      - name: Build base image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          file: extras/docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ vars.REGISTRY_REPO }}/base:latest
            ${{ vars.REGISTRY_REPO }}/base:${{ env.BUILD_DATE }}
