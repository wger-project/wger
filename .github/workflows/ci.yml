name: Continuous Integration

on:
  push:
    branches: [ master, ]
    paths:
      - '**.py'
      - 'pyproject.toml'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master, ]
    paths:
      - '**.py'
      - 'pyproject.toml'

jobs:
  ci-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DJANGO_SETTINGS_MODULE: settings.ci
      DJANGO_MEDIA_ROOT: /tmp/wger-test

    strategy:
      matrix:
        # Note: removed 3.14 because lingua-language-detector has no wheels yet
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    name: CI job (python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          uv sync --group dev
          mkdir /tmp/wger-test

      # Only run the tests with coverage for one version of python.
      - name: Test the application with coverage
        if: matrix.python-version == 3.13
        run: |
          uv run coverage run --source='.' ./manage.py test --parallel auto
          uv run coverage lcov

      - name: Test the application
        if: matrix.python-version != 3.13
        run: |
          uv run ./manage.py test --parallel auto

      - name: Coveralls
        if: matrix.python-version == 3.13
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov
